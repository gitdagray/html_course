<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>Contact Us</h1>
        <nav>
            <ul>
                <li><a href="/home.html">Home</a></li>
                <li><a href="home.html#1">About LTS</a></li>
                <li><a href="home.html#2">Our Menu</a></li>
                <li><a href="/shopHours.html">Store Hours</a></li>
            </ul>
        </nav>
        <figure>
        <img src="/img/tacos_close_up_400x260.png" alt="">
        <figcaption>Little Taco Shop Tacos</figcaption>
        </figure>
    </header>
    <main>
        <h3>Our Contact Form</h3>
        <fieldset>
            <legend>Send Us A Message</legend>
            <br>
            <form action="">
            <label for="name">Name: 
                <input type="text" name="name" id="name" placeholder="your name"></label>
            <br>
            <br>
            <label for="email">E-Mail: 
                <input type="email" name="mail" id="email" placeholder="your email"></label>
            <br>
            <br>
            <label for="msg">
                Your Message
                <br>    
                <textarea name="msg" id="msg" placeholder="Type your message here" rows="10" cols="30"></textarea>
            </label>
        </fieldset>
        <button>Send</button>
        <button type="reset">Reset</button>
        </form>
        <h3>Our Location</h3>
        <address>555 Taco Temptation Lane, Suite T<br>Kansas City, MO 55555-5555
        <br><br>Phone: <a href="tel:+915555555555">555-555-5555</a></address>
        <br>
        <a href="">Back to Top</a>
    </main>
    <footer>
        <hr>
        <p>Copyright &copy; The Little Taco Shop</p>
    </footer>
</body>
</html>
